name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: georadar
          POSTGRES_PASSWORD: georadar_ci_pw
          POSTGRES_DB: georadar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U georadar -d georadar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://georadar:georadar_ci_pw@localhost:5432/georadar
      AUTH_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      CREDENTIAL_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      YUANBAO_SEARCH_ENABLED: "false"
      APP_URL: http://127.0.0.1:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Docker Compose one-click
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Prepare demo env
        run: |
          cat > .env.docker <<'EOF'
          POSTGRES_PASSWORD=ci_docker_pw
          AUTH_SECRET=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          CREDENTIAL_ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          CRON_SECRET=ci_docker_cron
          YUANBAO_SEARCH_ENABLED=false
          APP_URL=http://localhost:3000
          APP_PORT=3000
          POSTGRES_PORT=15432
          EOF

      - name: Build and start via Compose
        run: docker compose --env-file .env.docker up -d --build --wait

      - name: Smoke test
        run: |
          curl -fsS http://localhost:3000/login > /dev/null
          docker compose --env-file .env.docker ps

      - name: Dump logs on failure
        if: failure()
        run: docker compose --env-file .env.docker logs --no-color

      - name: Stop
        if: always()
        run: docker compose --env-file .env.docker down -v
