services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: georadar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env.docker 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: georadar
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U georadar -d georadar"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://georadar:${POSTGRES_PASSWORD}@db:5432/georadar
      AUTH_SECRET: ${AUTH_SECRET:?请在 .env.docker 中设置 AUTH_SECRET}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?请在 .env.docker 中设置 CREDENTIAL_ENCRYPTION_KEY}
      YUANBAO_SEARCH_ENABLED: ${YUANBAO_SEARCH_ENABLED:-false}
      SEARCH_CONCURRENCY: ${SEARCH_CONCURRENCY:-2}
      SEARCH_TIMEOUT_MS: ${SEARCH_TIMEOUT_MS:-30000}
      APP_URL: ${APP_URL:-http://localhost:3000}
      CRON_SECRET: ${CRON_SECRET:-}
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  scheduler:
    build: .
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    entrypoint: ["node", "scripts/scheduler.mjs"]
    environment:
      APP_URL: http://app:3000
      CRON_SECRET: ${CRON_SECRET:?请在 .env.docker 中设置 CRON_SECRET}
      SCHEDULE_TICK_INTERVAL_MS: ${SCHEDULE_TICK_INTERVAL_MS:-60000}


volumes:
  pgdata:
