services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: georadar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
      POSTGRES_DB: georadar
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U georadar -d georadar"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://georadar:${POSTGRES_PASSWORD:-change_me_in_production}@db:5432/georadar
      AUTH_SECRET: ${AUTH_SECRET:?请在 .env 或环境中设置 AUTH_SECRET}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?请在 .env 或环境中设置 CREDENTIAL_ENCRYPTION_KEY}
      YUANBAO_SEARCH_ENABLED: ${YUANBAO_SEARCH_ENABLED:-false}
      SEARCH_CONCURRENCY: ${SEARCH_CONCURRENCY:-2}
      SEARCH_TIMEOUT_MS: ${SEARCH_TIMEOUT_MS:-30000}
    ports:
      - "3000:3000"

volumes:
  pgdata:
